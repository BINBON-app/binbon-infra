name: Build and Deploy Services

# Copy this file to the SERVICE MONOREPO at .github/workflows/build-and-deploy.yml
# (not the infra repo — this builds and deploys application code directly via the
# ECS API. It never touches Terraform state, so it can run as often as you push.)
#
# Assumes each service lives at crates/<name>/ with its own Dockerfile, e.g.
# crates/api-gateway/Dockerfile, and that Terraform has already created that
# service's ECS service/cluster/task definition at least once (see the infra
# repo's terragrunt/envs/<env>/eu-central-1/services stack), and that the
# environment's single ECR repo (binbon-<env>) already exists.
#
# Environment routing:
#   push to main       -> dev
#   push to staging    -> staging
#   push to production -> prod
#   workflow_dispatch  -> whichever environment/service you pick manually
#
# Pipeline shape (per changed service, fanned out in parallel):
#   detect-changes -> build (Dockerfile -> immutable SHA-tagged image -> ECR)
#                  -> deploy (ECS task definition -> ECS Fargate)
# The build and deploy stages are separate jobs, matching a build/deploy stage
# split; the image tag is deterministic (`<service>-<sha>`) so the deploy job
# recomputes it instead of needing cross-job output plumbing.

on:
  push:
    branches: [main, staging, production]
    paths:
      - "crates/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, staging, prod]
        default: dev
      service:
        description: "Service to deploy (manual runs only — push events use path detection instead)"
        type: choice
        options:
          - admin-service
          - analytics-service
          - api-gateway
          - audit-service
          - auth-service
          - call-service
          - chat-service
          - comment-service
          - device-service
          - engagement-service
          - feed-service
          - fraud-service
          - gift-service
          - live-service
          - location-service
          - media-service
          - moderation-service
          - notification-service
          - payment-service
          - payout-service
          - pk-service
          - presence-service
          - rbac-service
          - recommendation-service
          - report-service
          - search-service
          - sticker-service
          - story-service
          - user-service
          - video-processing-service
          - wallet-service

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Map branch to environment
        id: env
        run: |
          case "${{ github.ref_name }}" in
            production) echo "environment=prod" >> "$GITHUB_OUTPUT" ;;
            staging)    echo "environment=staging" >> "$GITHUB_OUTPUT" ;;
            *)          echo "environment=dev" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin-service:
              - 'crates/admin-service/**'
            analytics-service:
              - 'crates/analytics-service/**'
            api-gateway:
              - 'crates/api-gateway/**'
            audit-service:
              - 'crates/audit-service/**'
            auth-service:
              - 'crates/auth-service/**'
            call-service:
              - 'crates/call-service/**'
            chat-service:
              - 'crates/chat-service/**'
            comment-service:
              - 'crates/comment-service/**'
            device-service:
              - 'crates/device-service/**'
            engagement-service:
              - 'crates/engagement-service/**'
            feed-service:
              - 'crates/feed-service/**'
            fraud-service:
              - 'crates/fraud-service/**'
            gift-service:
              - 'crates/gift-service/**'
            live-service:
              - 'crates/live-service/**'
            location-service:
              - 'crates/location-service/**'
            media-service:
              - 'crates/media-service/**'
            moderation-service:
              - 'crates/moderation-service/**'
            notification-service:
              - 'crates/notification-service/**'
            payment-service:
              - 'crates/payment-service/**'
            payout-service:
              - 'crates/payout-service/**'
            pk-service:
              - 'crates/pk-service/**'
            presence-service:
              - 'crates/presence-service/**'
            rbac-service:
              - 'crates/rbac-service/**'
            recommendation-service:
              - 'crates/recommendation-service/**'
            report-service:
              - 'crates/report-service/**'
            search-service:
              - 'crates/search-service/**'
            sticker-service:
              - 'crates/sticker-service/**'
            story-service:
              - 'crates/story-service/**'
            user-service:
              - 'crates/user-service/**'
            video-processing-service:
              - 'crates/video-processing-service/**'
            wallet-service:
              - 'crates/wallet-service/**'

  build:
    needs: detect-changes
    if: |
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.services != '[]')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || needs.detect-changes.outputs.environment }}
    strategy:
      matrix:
        service: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.service)) || fromJSON(needs.detect-changes.outputs.services) }}
    env:
      ENVIRONMENT: ${{ inputs.environment || needs.detect-changes.outputs.environment }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push image
        run: |
          set -euo pipefail
          REPO="${{ steps.ecr.outputs.registry }}/binbon-${ENVIRONMENT}"
          IMAGE_TAG="${{ matrix.service }}-${TAG}"
          # Build context is the repo root, not the crate directory — this is a
          # Cargo workspace, so each crate's Dockerfile needs the workspace root
          # Cargo.toml/Cargo.lock (and any sibling crate it depends on) in scope.
          docker build -f "crates/${{ matrix.service }}/Dockerfile" -t "$REPO:$IMAGE_TAG" .
          docker push "$REPO:$IMAGE_TAG"

  deploy:
    needs: [detect-changes, build]
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || needs.detect-changes.outputs.environment }}
    strategy:
      matrix:
        service: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.service)) || fromJSON(needs.detect-changes.outputs.services) }}
    env:
      ENVIRONMENT: ${{ inputs.environment || needs.detect-changes.outputs.environment }}
      TAG: ${{ github.sha }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Register new task definition revision
        id: register
        run: |
          set -euo pipefail
          REPO="${{ steps.ecr.outputs.registry }}/binbon-${ENVIRONMENT}"
          IMAGE_TAG="${{ matrix.service }}-${TAG}"
          FAMILY="binbon-${ENVIRONMENT}-${{ matrix.service }}"

          aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query taskDefinition > task-def.json

          jq --arg IMAGE "$REPO:$IMAGE_TAG" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' task-def.json > task-def-patched.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def-patched.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "task_definition_arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy and wait for stability
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "binbon-${ENVIRONMENT}" \
            --service "${{ matrix.service }}" \
            --task-definition "${{ steps.register.outputs.task_definition_arn }}" \
            --force-new-deployment > /dev/null

          aws ecs wait services-stable \
            --cluster "binbon-${ENVIRONMENT}" \
            --services "${{ matrix.service }}"
